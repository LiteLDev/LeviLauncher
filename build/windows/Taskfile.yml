version: "3"

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:update:build-assets
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}.exe
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      # VERSION is the SemVer from the release tag (without leading "v"), e.g. 1.2.3 or 1.2.3-beta.1.
      VERSION: '{{.VERSION | default "0.0.0-dev" | trimPrefix "v"}}'
      VERSION_LDFLAGS: '-X github.com/liteldev/LeviLauncher/internal/update.appVersion={{.VERSION}}'
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-H windowsgui {{.VERSION_LDFLAGS}}"{{else}}-buildvcs=false -gcflags=all="-l" -ldflags="{{.VERSION_LDFLAGS}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: "{{.ARCH | default ARCH}}"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: create:installer

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      # Stamp the version resource from VERSION: the fixed (numeric) versions drop the
      # SemVer prerelease, while the ProductVersion string keeps the full version.
      - >-
        printf '%s\n' '{"fixed":{"file_version":"{{.NUMERIC_VERSION}}","product_version":"{{.NUMERIC_VERSION}}"},"info":{"0409":{"FileVersion":"{{.NUMERIC_VERSION}}","ProductVersion":"{{.VERSION}}","CompanyName":"LeviMC","FileDescription":"A Minecraft Launcher","LegalCopyright":"(c) 2024-2026, LeviMC","ProductName":"{{.APP_NAME}}","OriginalFilename":"{{.APP_NAME}}.exe"}}}' > ../wails_windows_info.json
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info ../wails_windows_info.json -out ../wails_windows_{{.ARCH}}.syso
      - cmd: powershell Remove-item ../wails_windows_info.json
        platforms: [windows]
      - cmd: rm -f ../wails_windows_info.json
        platforms: [linux, darwin]
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      VERSION: '{{.VERSION | default "0.0.0-dev" | trimPrefix "v"}}'
      NUMERIC_VERSION: '{{regexReplaceAll "[-+].*$" .VERSION ""}}'

  create:installer:
    summary: Creates the MSI and setup.exe installers with WiX
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - pwsh -NoProfile -File "{{.ROOT_DIR}}/packaging/wix/build.ps1" -Version "{{.VERSION}}" -Arch x64 -BinDir "{{.ROOT_DIR}}/{{.BIN_DIR}}" -OutDir "{{.ROOT_DIR}}/{{.BIN_DIR}}"
    vars:
      VERSION: '{{.VERSION | default "0.0.0-dev"}}'

  create:msix:package:
    summary: Creates an MSIX package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - |-
        wails3 tool msix \
          --config "{{.ROOT_DIR}}/wails.json" \
          --name "{{.APP_NAME}}" \
          --executable "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" \
          --arch "{{.ARCH}}" \
          --out "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix" \
          {{if .CERT_PATH}}--cert "{{.CERT_PATH}}"{{end}} \
          {{if .PUBLISHER}}--publisher "{{.PUBLISHER}}"{{end}} \
          {{if .USE_MSIX_TOOL}}--use-msix-tool{{else}}--use-makeappx{{end}}
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      CERT_PATH: '{{.CERT_PATH | default ""}}'
      PUBLISHER: '{{.PUBLISHER | default ""}}'
      USE_MSIX_TOOL: '{{.USE_MSIX_TOOL | default "false"}}'

  install:msix:tools:
    summary: Installs tools required for MSIX packaging
    cmds:
      - wails3 tool msix-install-tools

  run:
    cmds:
      - node ./build/wait-for-dev-server.mjs
      - "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
