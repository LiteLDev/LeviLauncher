name: CI

on:
  pull_request:
    paths-ignore: &docs-only
      - "**.md"
      - "COPYING"
      - "THIRD_PARTY_NOTICES"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches:
      - main
    paths-ignore: *docs-only
  # release.yml builds the tagged commit through this workflow.
  workflow_call:
  workflow_dispatch:

# A newer push to the same pull request makes the older run pointless, so it
# is cancelled; runs on main and release builds always finish. The event name
# keeps a release's call of this workflow out of the group of a main push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    name: Native loader
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.9"

      - name: Build native loader from source
        working-directory: native/levilauncher
        shell: bash
        run: |
          xmake f -p windows -a x64 -m release --toolchain=msvc --deploy=y -y
          xmake -y

      - name: Test native loader
        working-directory: native/levilauncher
        shell: bash
        run: |
          xmake -y native_tests
          xmake run native_tests

      - name: Upload native loader artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: native-loader-windows-x64
          path: internal/leviloader/LeviLauncher.dll
          retention-days: 1
          if-no-files-found: error

  quality:
    name: Quality gates
    needs: native
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Download native loader artifact
        uses: actions/download-artifact@v8.0.0
        with:
          name: native-loader-windows-x64
          path: internal/leviloader

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test the lip catalogue logic against the shared fixture
        working-directory: frontend
        run: npm run test:lipcatalog

      - name: Test the levilauncher:// link routes
        working-directory: frontend
        run: npm run test:deeplink

      - name: Generate Wails bindings
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          "$(go env GOPATH)/bin/wails3" generate bindings -clean=true

      - name: Build frontend and enforce bundle budget
        working-directory: frontend
        run: npm run build

      # bash stops at the first failing command; under pwsh only the last
      # command's exit code decided the step, so failing tests went unnoticed.
      # internal/storage runs in its own job.
      - name: Test and vet Go code
        shell: bash
        run: |
          go vet ./...
          mapfile -t pkgs < <(go list ./... | grep -v '/internal/storage$')
          go test "${pkgs[@]}"
          go test -race ./internal/downloader ./internal/curseforge/client

  storage:
    name: Storage migration tests
    # internal/storage does not embed the native loader, so it starts at once.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pull requests run the crash hunt with -short (one crash variant per
      # journal record); main and releases run the default matrix.
      - name: Test internal/storage
        shell: bash
        run: go test ${{ github.event_name == 'pull_request' && '-short' || '' }} ./internal/storage

  build-windows:
    name: Build (windows/amd64)
    needs: native
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download native loader artifact
        uses: actions/download-artifact@v8.0.0
        with:
          name: native-loader-windows-x64
          path: internal/leviloader

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

          $isccPath = $null
          $candidateDirs = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7",
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "$env:ProgramFiles\Inno Setup 7",
            "$env:ProgramFiles\Inno Setup 6"
          )

          foreach ($dir in $candidateDirs) {
            $candidate = Join-Path $dir "ISCC.exe"
            if (Test-Path $candidate) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $isccPath = $candidate
              break
            }
          }

          if (-not $isccPath) {
            $command = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($command) {
              $isccPath = $command.Source
            }
          }

          if (-not $isccPath) {
            throw "iscc.exe was not found after installing Inno Setup."
          }

          Write-Host "Using Inno Setup compiler: $isccPath"

          # Supply every language file project.iss declares that this Inno Setup
          # build does not ship, so adding a [Languages] entry cannot break CI.
          $innoDir = Split-Path -Path $isccPath -Parent
          $sourceRoot = "https://raw.githubusercontent.com/jrsoftware/issrc/6ef32198ef1f7b7b375cd4b6b90896c2a58eb4c2/Files"
          $script = Get-Content -Path "build/windows/inno/project.iss" -Raw
          $references = [regex]::Matches($script, 'MessagesFile: "compiler:([^"]+)"') |
            ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique

          foreach ($reference in $references) {
            $target = Join-Path $innoDir $reference
            if (Test-Path $target) {
              Write-Host "Language file already present: $reference"
              continue
            }
            $url = "$sourceRoot/$($reference -replace '\\', '/')"
            Write-Host "Downloading missing language file: $url"
            New-Item -ItemType Directory -Path (Split-Path -Path $target -Parent) -Force | Out-Null
            Invoke-WebRequest -Uri $url -OutFile $target -ErrorAction Stop
          }

      # go-version follows go.mod; an older one made Go download the toolchain
      # go.mod asks for on every run and missed the build cache.
      - uses: ToQuery/wails3-build-action@v3-alpha.14
        with:
          go-archs: amd64
          go-version: "1.27.3"
          node-version: "24"
          wails3-version: "v3.0.0"
          package: false

      - name: Test installer prerequisite handling
        run: node build/windows/inno/prerequisites.test.mjs

      - name: Test installer wizard layout
        run: node build/windows/inno/wizard-ui.test.mjs

      - name: Verify build outputs
        shell: pwsh
        run: |
          cd bin
          foreach ($file in @("LeviLauncher.exe", "LeviLauncher-amd64-installer.exe")) {
            if (-not (Test-Path $file)) {
              throw "Required build output not found: $file"
            }
          }
          Get-ChildItem

      - name: Upload standalone EXE artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          path: bin/LeviLauncher.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          path: bin/LeviLauncher-amd64-installer.exe
          archive: false
          if-no-files-found: error

  build-macos:
    name: Build (darwin/arm64)
    needs: native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download native loader artifact
        uses: actions/download-artifact@v8.0.0
        with:
          name: native-loader-windows-x64
          path: internal/leviloader

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and vet macOS Go code
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.6"
        run: |
          set -euo pipefail
          PKGS=(
            ./internal/app
            ./internal/apppath
            ./internal/config
            ./internal/deeplink
            ./internal/diagnose
            ./internal/downloader
            ./internal/explorer
            ./internal/gameauth
            ./internal/gameconsole
            ./internal/gameinput
            ./internal/gameruntime
            ./internal/gameshell
            ./internal/httpx
            ./internal/launch
            ./internal/leviloader
            ./internal/lip
            ./internal/lipcore/archive
            ./internal/lipcore/install
            ./internal/lipcore/lipdirs
            ./internal/mods
            ./internal/nativeinstall
            ./internal/oslang
            ./internal/peeditor
            ./internal/processinfo
            ./internal/registry
            ./internal/update
            ./internal/utils
            ./internal/versionlaunch
            ./internal/versions
            ./internal/xbox
          )
          go vet "${PKGS[@]}"
          go test -count=1 "${PKGS[@]}"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build macOS application bundle
        run: |
          python3 build/native/macos.py \
            --loader internal/leviloader/LeviLauncher.dll \
            --output bin/LeviLauncher.app

      - name: Package macOS DMG installer
        run: |
          python3 build/native/dmg.py \
            --app bin/LeviLauncher.app \
            --output bin/LeviLauncher-macos-arm64-installer.dmg

      - name: Verify build outputs
        run: |
          test -d bin/LeviLauncher.app
          test -f bin/LeviLauncher-macos-arm64-installer.dmg
          codesign --verify --deep --strict bin/LeviLauncher.app
          hdiutil verify bin/LeviLauncher-macos-arm64-installer.dmg
          ls -la bin

      - name: Upload macOS DMG installer artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          path: bin/LeviLauncher-macos-arm64-installer.dmg
          archive: false
          if-no-files-found: error
